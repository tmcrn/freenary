    <path d="M297 396V171a11 11 0 0 1 11 -11h40a11 11 0 0 1 11 11V396z" fill="#F5B6D7"/>
    <path d="M369 396V217a11 11 0 0 1 11 -11h40a11 11 0 0 1 11 11V396z" fill="#C3B4EA"/>
  </g>
  <!-- Reflet et filets sur le dos de chaque livre -->
  <g fill="#FFFFFF" opacity=".28">
    <rect x="128" y="208" width="8" height="176" rx="4"/>
    <rect x="200" y="146" width="8" height="238" rx="4"/>
    <rect x="272" y="100" width="8" height="284" rx="4"/>
    <rect x="344" y="172" width="8" height="212" rx="4"/>
    <rect x="416" y="218" width="8" height="166" rx="4"/>
