<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Freenary</title>
  <!-- Fond plein : iOS applique lui-même le masque arrondi -->
  <rect width="512" height="512" fill="#1E1C19"/>
  <!-- Les livres de l'étagère des dépenses : bleu, vert, jaune (le plus haut, avec son marque-page), rose, violet -->
  <g>
    <path d="M81 396V207a11 11 0 0 1 11 -11h40a11 11 0 0 1 11 11V396z" fill="#B4C7F0"/>
    <path d="M153 396V145a11 11 0 0 1 11 -11h40a11 11 0 0 1 11 11V396z" fill="#A9DDBD"/>
