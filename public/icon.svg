  <g fill="#1E1C19" opacity=".22">
    <rect x="90" y="230" width="44" height="5" rx="2.5"/><rect x="90" y="350" width="44" height="5" rx="2.5"/>
    <rect x="162" y="168" width="44" height="5" rx="2.5"/><rect x="162" y="350" width="44" height="5" rx="2.5"/>
    <rect x="234" y="152" width="44" height="5" rx="2.5"/><rect x="234" y="350" width="44" height="5" rx="2.5"/>
    <rect x="306" y="194" width="44" height="5" rx="2.5"/><rect x="306" y="350" width="44" height="5" rx="2.5"/>
    <rect x="378" y="240" width="44" height="5" rx="2.5"/><rect x="378" y="350" width="44" height="5" rx="2.5"/>
  </g>
  <path d="M263 88h15v46l-7.5 -10 -7.5 10z" fill="#F5B6D7"/>
